<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>技术丞相 · TechChancellor</title>
  <link rel="stylesheet" href="/assets/app.css?v=0.9.0">
</head>
<body>
  <div class="app-shell">
    <header class="app-chrome">
      <a class="brand" href="#home" aria-label="返回首页">
        <span class="brand-seal" aria-hidden="true">丞</span>
        <span><strong>技术丞相</strong><small>TechChancellor</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-item active" href="#home" data-view="home"><span class="nav-icon">⌂</span><span>首页</span></a>
        <a class="nav-item" href="#capabilities" data-view="capabilities"><span class="nav-icon">◇</span><span>能力库</span></a>
        <a class="nav-item" href="#activity" data-view="activity"><span class="nav-icon">↻</span><span>动态</span></a>
        <a class="nav-item" href="#system" data-view="system"><span class="nav-icon">◌</span><span>状态</span></a>
        <a class="nav-item" href="#documents" data-view="documents"><span class="nav-icon">▤</span><span>文档</span></a>
      </nav>
      <div class="chrome-actions">
        <a id="global-health" class="rail-health" href="#system"><span class="pulse-dot"></span><span>正在连接</span></a>
        <label class="theme-control"><span>外观</span><select id="theme-select" aria-label="界面主题"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <button class="icon-button" data-action="refresh" title="刷新本地数据" aria-label="刷新本地数据">↻</button>
      </div>
    </header>
    <main id="app" class="content" aria-live="polite"></main>
    <footer class="app-meta"><span id="current-view-label">总览</span><span id="last-refresh">读取本地数据中</span></footer>
  </div>
  <script src="/assets/app.js?v=0.9.0"></script>
</body>
</html>
